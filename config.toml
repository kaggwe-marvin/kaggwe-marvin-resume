# The URL the site will be built for
base_url = "https://kaggwemarvinvictor.me"
title = "Kaggwe Marvin: Notes"
description = "Notes, tutorials and projects by Kaggwe Marvin, a developer in Kampala, Uganda, writing about MikroTik RouterOS, Linux on Windows and building for the web."
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Feeds are switched on per section (the blog), not for the whole site
generate_feeds = false
feed_filenames = ["atom.xml"]

[extra]
name = "Kaggwe Marvin Victor"
short_name = "Kaggwe Marvin"
role = "Full-Stack Developer"
location = "Kampala, Uganda"
email = "kaggwemarvin@gmail.com"
github = "github.com/kaggwe-marvin"

# The main resume site. Shared posts point their canonical URL there,
# and both sites describe the same person.
main_site = "https://kaggwe-marvin.github.io/Personal-Resume"

# Search and social
og_image = "images/og.png"
og_image_alt = "Kaggwe Marvin: notes, tutorials and projects"
same_as = [
    "https://github.com/kaggwe-marvin",
    "https://kaggwe-marvin.github.io/Personal-Resume/",
]
knows_about = [
    "Python", "Django", "TypeScript", "MikroTik RouterOS", "MSYS2", "QEMU",
    "Static site generators", "GitHub Actions", "IT support",
]

