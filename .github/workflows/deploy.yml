name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: 0.23.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          zola --version
      - name: Build
        run: zola build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex and other IndexNow search engines which pages exist,
  # so new and changed pages are crawled quickly.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://kaggwe-marvin.github.io/kaggwe-marvin-resume
      KEY: 9065fbaa5348b0336100a6653d0178b1
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 30
          urls=$(curl -fsSL "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: "kaggwe-marvin.github.io", key: $key, keyLocation: $loc, urlList: $urls}')
          echo "$body"
          curl -sS -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$body"
